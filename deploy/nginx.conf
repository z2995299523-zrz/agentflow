# 独立 HTTPS 端口；复用同机已经自动续期的 IP 证书。
server {
    listen 8447 ssl;
    server_name __SERVER_NAME__;
    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 =308 __PUBLIC_URL__$request_uri;
    server_tokens off;
    client_max_body_size 64k;
    root /opt/agentflow/current/web/dist;
    index index.html;
    access_log /var/log/nginx/agentflow.access.log;
    error_log /var/log/nginx/agentflow.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8790/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
