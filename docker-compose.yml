version: "3.8"

# 前后端分开两个容器：api 是接口服务（FastAPI），web 是界面（nginx 托管构建产物，/api 转给 api）
services:
  api:
    build: .
    container_name: agentflow-api
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    environment:
      # LLM 配置
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      # HuggingFace 镜像（国内加速）
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      # 专题库资料目录与执行层
      - MART_DIR=${MART_DIR:-./data/mock_mart}
      - EXECUTOR=${EXECUTOR:-none}
    volumes:
      # 专题库资料与生成物（元数据库、会话历史、模拟库），在宿主机上导入、切换资料
      - ./data:/app/data
      # HuggingFace 模型缓存（避免每次重启重下载 BGE）
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  web:
    build: ./web
    container_name: agentflow-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  hf_cache:
