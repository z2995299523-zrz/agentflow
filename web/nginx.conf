# 界面的 nginx 配置：托管构建产物；/api 开头的请求去掉前缀转给接口服务（docker-compose 里的 api:8000）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 接口：proxy_pass 末尾的 / 去掉 /api 前缀。查数是 SSE 流式返回：不缓冲，读超时放长（一轮可能几分钟）
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # 文件名带哈希的静态资源：长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端路由（/c/会话、/metadata）：没有对应文件就回 index.html，由浏览器里的路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
