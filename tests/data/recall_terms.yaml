- id: U04
  level: 1
  metrics: [折人民币余额]
  dimensions: [账号, 币种代码, 是否保证金]
  filters: [客户号]

- id: U05
  level: 2
  metrics: [对公存款账户数]
  filters: [账户状态]

# ═══════════════ 追问（用第二轮之后的完整需求） ═══════════════

- id: F01
  requirement: 查 2026 年 9 月末全行不含保证金的对公存款余额，按一级分行拆开，列出一级分行名称和余额
  metrics: [不含保证金的对公存款余额]
  dimensions: [一级分行名称]

- id: F02
  requirement: 查 2026 年 6 月末各行业的对公贷款余额，列出行业名称和余额
  metrics: [对公贷款余额]
  dimensions: [行业名称]

- id: F03
  requirement: 查 2026 年 9 月末各开户机构含保证金的对公存款余额，列出机构号和余额
  metrics: [含保证金的对公存款余额]
  dimensions: [开户机构, 机构号]

- id: F04
  requirement: 查 2026 年 9 月末不含保证金存款余额最高的 10 个制造业对公客户，列出客户名称和余额，按余额从高到低排列
  metrics: [不含保证金的存款余额]
  dimensions: [客户名称]
  filters: [行业]

- id: F05
  requirement: 查 2026 年 9 月末全行对公不良贷款余额
  metrics: [对公不良贷款余额]
