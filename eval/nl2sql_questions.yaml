  gold_sql: |
    SELECT c.industry_nm, SUM(b.dep_bal_rmb) AS dep_bal_rmb
    FROM ads.corp_cust_dep_bal_d b
    JOIN dim.corp_cust c ON b.cust_no = c.cust_no
