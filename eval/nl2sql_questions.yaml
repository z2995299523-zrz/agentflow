# NL2SQL 评估题库（模拟专题库：银行对公存贷款）
#
# 评估时固定「今天」为 2026-10-13，所以「上月末」是 2026-09-30，「年初」对比的是 2025-12-31。
# 标准 SQL 按 GaussDB / PostgreSQL 方言书写，评估时转换成 DuckDB 方言在模拟库上执行。
#
# 字段说明：
#   id            题目编号
#   category      类别
#   turns         用户输入，追问题有两轮
#   expect        sql 表示期望生成 SQL，clarify 表示期望被反问
#   ordered       结果是否要求行顺序（默认 false）
#   gold_tables   标准用表
#   gold_columns  关键字段
#   gold_sql      标准 SQL（追问题是第二轮的标准 SQL）
#
# 有涉及维度列的题目，题面里都写明了要列出哪些列，避免因为多列少列产生争议。

# ═══════════════ 基础时点余额：单表、口径明确 ═══════════════

- id: B01
  category: 基础时点余额
  turns: ["查 2026 年 9 月末全行对公贷款余额"]
  expect: sql
  gold_tables: [ads.corp_cust_loan_bal_d]
  gold_columns: [ads.corp_cust_loan_bal_d.loan_bal_rmb]
  gold_sql: |
    SELECT SUM(loan_bal_rmb) AS loan_bal_rmb
    FROM ads.corp_cust_loan_bal_d
