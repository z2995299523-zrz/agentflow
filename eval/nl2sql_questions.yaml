# ═══════════════ 时间口径：较年初、较上月、日均、相对日期 ═══════════════

- id: T01
  category: 时间口径
  turns: ["查 2026 年 9 月末各一级分行对公贷款余额较上月末的增量，列出一级分行名称和增量"]
  expect: sql
  gold_tables: [ads.corp_cust_loan_bal_d, dim.org]
  gold_columns: [ads.corp_cust_loan_bal_d.loan_bal_rmb, ads.corp_cust_loan_bal_d.data_dt, dim.org.lvl1_org_nm]
  gold_sql: |
    SELECT o.lvl1_org_nm,
           SUM(CASE WHEN l.data_dt = DATE '2026-09-30' THEN l.loan_bal_rmb ELSE 0 END)
         - SUM(CASE WHEN l.data_dt = DATE '2026-08-31' THEN l.loan_bal_rmb ELSE 0 END) AS loan_bal_inc
    FROM ads.corp_cust_loan_bal_d l
    JOIN dim.org o ON l.org_no = o.org_no
    WHERE l.data_dt IN (DATE '2026-09-30', DATE '2026-08-31')
    GROUP BY o.lvl1_org_nm

- id: T02
  category: 时间口径
  turns: ["查 2026 年 9 月末全行不含保证金的对公存款余额较年初的增量"]
  expect: sql
  gold_tables: [ads.org_corp_dep_bal_d]
  gold_columns: [ads.org_corp_dep_bal_d.dep_bal_rmb, ads.org_corp_dep_bal_d.data_dt]
  gold_sql: |
    SELECT SUM(CASE WHEN data_dt = DATE '2026-09-30' THEN dep_bal_rmb ELSE 0 END)
         - SUM(CASE WHEN data_dt = DATE '2025-12-31' THEN dep_bal_rmb ELSE 0 END) AS dep_bal_inc
    FROM ads.org_corp_dep_bal_d
    WHERE data_dt IN (DATE '2026-09-30', DATE '2025-12-31')

- id: T03
  category: 时间口径
  turns: ["查 2026 年 9 月末各开户机构不含保证金的对公存款年日均余额，列出机构号和年日均余额"]
  expect: sql
