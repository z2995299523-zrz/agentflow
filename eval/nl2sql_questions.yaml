- id: F04
  category: 追问
  turns:
    - "查 2026 年 9 月末不含保证金存款余额最高的 10 个对公客户，列出客户名称和余额，按余额从高到低排列"
    - "只看制造业的客户"
  expect: sql
  ordered: true
  gold_tables: [ads.corp_cust_dep_bal_d, dim.corp_cust]
  gold_columns: [ads.corp_cust_dep_bal_d.dep_bal_rmb, dim.corp_cust.cust_nm, dim.corp_cust.industry_nm]
  gold_sql: |
    SELECT c.cust_nm, SUM(b.dep_bal_rmb) AS dep_bal_rmb
    FROM ads.corp_cust_dep_bal_d b
