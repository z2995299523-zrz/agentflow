- id: T04
  category: 时间口径
  turns: ["查 2026 年 9 月末全行不含保证金的对公存款月日均余额"]
  expect: sql
  gold_tables: [ads.corp_cust_dep_bal_d]
  gold_columns: [ads.corp_cust_dep_bal_d.mtd_avg_bal_rmb]
  gold_sql: |
    SELECT SUM(mtd_avg_bal_rmb) AS mtd_avg_bal_rmb
    FROM ads.corp_cust_dep_bal_d
    WHERE data_dt = DATE '2026-09-30'

- id: T05
  category: 时间口径
  turns: ["查上月末全行对公贷款余额较年初的增幅，用百分比表示并保留两位小数"]
  expect: sql
  gold_tables: [ads.corp_cust_loan_bal_d]
  gold_columns: [ads.corp_cust_loan_bal_d.loan_bal_rmb, ads.corp_cust_loan_bal_d.data_dt]
  gold_sql: |
    SELECT ROUND(100.0 * (SUM(CASE WHEN data_dt = DATE '2026-09-30' THEN loan_bal_rmb ELSE 0 END)
                        - SUM(CASE WHEN data_dt = DATE '2025-12-31' THEN loan_bal_rmb ELSE 0 END))
                 / SUM(CASE WHEN data_dt = DATE '2025-12-31' THEN loan_bal_rmb ELSE 0 END), 2) AS loan_bal_growth_pct
    FROM ads.corp_cust_loan_bal_d
    WHERE data_dt IN (DATE '2026-09-30', DATE '2025-12-31')

